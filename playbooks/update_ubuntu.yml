---
- name: Aggiornamento macchine Ubuntu remote
  hosts: ubuntu_servers
  become: true
  gather_facts: true

  vars:
    reboot_if_required: true

  tasks:
    - name: Aggiorna la cache dei pacchetti apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Esegue upgrade dei pacchetti installati
      apt:
        upgrade: dist

    - name: Rimuove pacchetti non più necessari
      apt:
        autoremove: yes
        autoclean: yes

    - name: Verifica se è richiesto un riavvio
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Riavvia la macchina se necessario
      reboot:
        msg: "Riavvio automatico dopo aggiornamento pacchetti"
        reboot_timeout: 900
      when:
        - reboot_if_required
        - reboot_required_file.stat.exists
