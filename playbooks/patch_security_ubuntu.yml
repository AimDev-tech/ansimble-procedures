---
- name: Patching Ubuntu + log locale (tutti i task nel playbook)
  hosts: ubuntu_servers
  become: true
  gather_facts: true

  vars:
    # Log sul controller Ansible (macchina da cui lanci ansible-playbook)
    local_log_dir: "logs"
    local_log_file: "/tmp/logs/ansible-patch.log"

    # APT non interattivo
    noninteractive_env:
      DEBIAN_FRONTEND: noninteractive

  pre_tasks:
    - name: Crea directory log locale sul controller (una sola volta)
      delegate_to: localhost
      become: false
      run_once: true
      file:
        path: "{{ local_log_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: Aggiorna cache APT
      apt:
        update_cache: yes
        cache_valid_time: 3600
      register: apt_update

    - name: Applica aggiornamenti (dist-upgrade, solo upgrade)
      apt:
        upgrade: dist
        only_upgrade: yes
      environment: "{{ noninteractive_env }}"
      register: apt_upgrade

    - name: Controlla se è richiesto reboot
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Riavvia se necessario
      reboot:
        reboot_timeout: 900
        test_command: "whoami"
      when: reboot_required_file.stat.exists | default(false)

    - name: Attendi che l'host torni raggiungibile (se riavviato)
      wait_for_connection:
        timeout: 300
      when: reboot_required_file.stat.exists | default(false)

    - name: Prepara una riga di log per questo host
      set_fact:
        log_line: >-
          {{ ansible_date_time.iso8601 }};
          host={{ inventory_hostname }};
          ip={{ ansible_host | default('n/a') }};
          apt_update_changed={{ apt_update.changed | default(false) }};
          apt_upgrade_changed={{ apt_upgrade.changed | default(false) }};
          reboot_required={{ reboot_required_file.stat.exists | default(false) }};
          rc={{ apt_upgrade.rc | default(0) }}

    - name: Scrive la riga di log sul controller (file locale)
      delegate_to: localhost
      become: false
      lineinfile:
        path: "{{ local_log_file }}"
        line: "{{ log_line | regex_replace('\\s+', ' ') }}"
        create: yes
        mode: "0644"
        insertafter: EOF

  post_tasks:
    - name: Report a video (per host)
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "APT update changed: {{ apt_update.changed | default(false) }}"
          - "APT upgrade changed: {{ apt_upgrade.changed | default(false) }}"
          - "Reboot richiesto: {{ reboot_required_file.stat.exists | default(false) }}"

