---
- name: "Sicurezza Attiva: Ban IP Malizioso"
  hosts: all
  become: yes
  vars:
    # Questa variabile verrà sovrascritta dallo script di Wazuh
    target_ip: "0.0.0.0"

  tasks:
    - name: "Verifica che l'IP sia valido e non nullo"
      fail:
        msg: "Nessun IP fornito o IP non valido."
      when: target_ip == "0.0.0.0" or target_ip == ""

    - name: "Aggiungi regola di DROP per l'IP malizioso"
      iptables:
        chain: INPUT
        source: "{{ target_ip }}"
        jump: DROP
        comment: "Bannato da Wazuh Active Response"
      register: iptables_result

    - name: "Conferma del ban"
      debug:
        msg: "L'IP {{ target_ip }} è stato rimosso dalla rete."
      when: iptables_result.changed
