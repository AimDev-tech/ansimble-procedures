---
- name: "Sicurezza Attiva: Ban IP Malizioso"
  hosts: "{{ target_host }}"
  become: yes

  tasks:
    - name: "Registra l'azione nel log di sistema locale"
      syslogger:
        msg: "WAZUH-ACTIVE-RESPONSE: Bannato IP {{ attacker_ip }} su richiesta del Manager"
        priority: "err"
        facility: "auth"

    - name: "Crea una entry in un file di log dedicato"
      lineinfile:
        path: /var/log/wazuh_bans.log
        line: "{{ ansible_date_time.iso8601 }} - BANNATO IP: {{ attacker_ip }} - Host: {{ inventory_hostname }}"
        create: yes
        owner: root
        group: root
        mode: '0640'

    - name: "Esegui il ban con iptables"
      iptables:
        chain: INPUT
        source: "{{ attacker_ip }}"
        jump: DROP
        comment: "Bannato da Wazuh"
